[defaults]
host_key_checking = False
# Use a /tmp-rooted dir: freshly provisioned VMs can fail to create
# ~/.ansible/tmp during early boot, but /tmp is always writable.
remote_tmp = /tmp/.ansible/tmp
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
pipelining = True
# Tolerate the brief window where sshd is up but the host is still settling.
retries = 3
